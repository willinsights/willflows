const statusTag=s=>'<span class="tag '+(/Assinado|Pago|Aprovado|Concluí|Finalizado|Ativo/.test(s)?'green':/Pendente|Por |aguardar|revisão/i.test(s)?'orange':'blue')+'">'+e(s)+'</span>';
function persist(){try{localStorage.setItem(key,JSON.stringify(db))}catch(x){}}
function notify(text){const root=document.getElementById('toast-root');root.innerHTML='<div class="toast">'+e(text)+'</div>';setTimeout(()=>root.innerHTML='',2600)}
function title(t,sub,action){return '<div class="page-head"><div><h1>'+e(t)+'</h1><p>'+e(sub)+'</p></div>'+(action||'')+'</div>'}
function kpi(k,n,desc,trend){
 const destinations={'Valor em projetos':'financeiro','Projetos ativos':'captacao','A receber':'pagamentos','Vídeos em revisão':'revisao','Tarefas abertas':'tarefas','Concluídas':'tarefas','Equipa':'equipa','Clientes':'crm','Leads':'crm','Valor comercial':'financeiro','Contratos':'contratos','Assinados':'contratos','Por assinar':'contratos','Por receber':'pagamentos','Recebido':'pagamentos','Documentos':'faturacao','Projetos contratados':'captacao','Custos estimados':'financeiro','Margem prevista':'financeiro','Projetos entregues':'finalizados','Taxa de entrega':'finalizados','Receita prevista':'financeiro','Versões aprovadas':'revisao','Faturas':'faturacao','Por emitir':'faturacao','Total':'faturacao','Workspaces':'admin','Utilizadores':'admin','Planos Studio':'planos','Alertas':'admin'};
 const dest=destinations[k]||'dashboard';
 return '<button type="button" class="card kpi-card" onclick="go(\''+dest+'\')" aria-label="Abrir '+e(k)+'" title="Abrir '+e(titles[dest]||dest)+'"><div class="small-head">'+e(k)+' <span style="float:right;color:#9274d7">↗</span></div><div class="kpi muted-number">'+e(n)+'</div><div class="kpi-desc">'+e(desc)+'</div>'+(trend?'<div class="hint positive" style="margin-top:8px">↗ '+e(trend)+'</div>':'')+'</button>'
}
function allProjects(){return db.projects.filter(p=>((p.name+' '+p.client+' '+p.owner).toLowerCase().includes(search.toLowerCase())))}
function nav(){document.getElementById('nav').innerHTML=navGroups.map(g=>'<div><div class="side-label">'+e(g[0])+'</div>'+g[1].map(n=>'<button class="nav-btn '+(route===n[0]?'active':'')+'" onclick="go(\''+n[0]+'\')"><span class="sym">'+n[1]+'</span>'+e(n[2])+'</button>').join('')+'</div>').join('')}
function toggleMenu(show){document.getElementById('sidebar').classList.toggle('open',show);document.getElementById('overlay').classList.toggle('open',show)}
function go(v){if(!titles[v])return;route=v;location.hash=v;search='';toggleMenu(false);render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(titles[next]&&next!==route){route=next;render()}});
function render(){nav();document.getElementById('crumb').textContent=titles[route];const pages={dashboard:dashboard,captacao:()=>pipeline(0),edicao:()=>pipeline(1),finalizados:()=>pipeline(2),tarefas:tasks,crm:crm,contratos:contracts,calendario:calendar,chat:chat,media:media,revisao:review,pagamentos:payments,financeiro:finance,relatorios:reports,faturacao:invoices,equipa:team,planos:plans,admin:admin,config:settings};document.getElementById('content').innerHTML=pages[route]();if(route==='chat'){let box=document.querySelector('.chat-history');if(box)box.scrollTop=box.scrollHeight}}
function dashboard(){
 const pending=db.payments.filter(x=>x.status==='Pendente');
 const pipelineVal=sum(db.projects,'amount');
 const chart=[4200,5700,4900,7200,6100,8750,7600];
 return title('Bom dia! 👋','Resumo da atividade do teu estúdio fictício', '<div class="toolbar"><button class="btn" onclick="resetDemo()">↺ Repor demo</button><button class="btn primary" onclick="modal(\'project\')">+ Novo projeto</button></div>')+
 '<div class="hero"><div><span style="font-size:11px;font-weight:700;color:#cdbcf6;letter-spacing:1px">NOVO · WILLFLOW 2.0</span><h2>Produção, equipa e finanças num só lugar.</h2><p>Explora todos os módulos com dados fictícios. Experimenta criar projetos, aprovar vídeos, mover tarefas e simular pagamentos.</p></div><button class="btn" onclick="go(\'edicao\')">Explorar projetos →</button></div>'+
 '<div class="grid">'+kpi('Valor em projetos',eur(pipelineVal),'Carteira simulada','Em crescimento')+kpi('Projetos ativos',db.projects.filter(x=>x.stage!==2).length,'Captação + edição')+kpi('A receber',eur(sum(pending)),'Pagamentos simulados')+kpi('Vídeos em revisão',db.reviews.filter(x=>x.state!=='Aprovado').length,'Aguardam interação')+'</div>'+
 '<div class="split section-space"><div class="card"><div class="surface-head"><h3>Receita por mês</h3><span class="hint">Exemplo ilustrativo · €</span></div><div class="chart">'+chart.map((v,i)=>'<div class="bar-wrap"><div class="bar" style="height:'+Math.round(v/9000*100)+'%"></div><span class="bar-label">'+['Mai','Jun','Jul','Ago','Set','Out','Nov'][i]+'</span></div>').join('')+'</div></div><div class="card"><div class="surface-head"><h3>Próximas entregas</h3><button class="btn sm" onclick="go(\'calendario\')">Calendário</button></div>'+db.projects.slice().sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4).map(p=>'<div class="list-row clickable-row" role="button" tabindex="0" onclick="showDetail(\'project\','+p.id+')" onkeydown="if(event.key===\'Enter\')showDetail(\'project\','+p.id+')"><span class="dot '+(p.stage===2?'green':'')+'"></span><div class="grow"><div class="name truncate">'+e(p.name)+' ↗</div><div class="sub">'+e(p.due)+'</div></div>'+statusTag(stages[p.stage])+'</div>').join('')+'</div></div>'+
 '<div class="grid two section-space"><div class="card"><div class="surface-head"><h3>Atividade da equipa</h3><button class="btn sm" onclick="go(\'tarefas\')">Ver tarefas →</button></div>'+db.tasks.slice(0,4).map(t=>'<div class="list-row"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask('+t.id+')"><div class="grow"><div class="name" style="'+(t.done?'text-decoration:line-through;color:#aaa':'')+'">'+e(t.title)+'</div><div class="sub">'+e(t.owner)+'</div></div></div>').join('')+'</div><div class="card"><div class="surface-head"><h3>Acesso rápido</h3></div><div class="grid two">'+[['▷','Revisão de vídeos','revisao'],['€','Financeiro','financeiro'],['♧','Clientes','crm'],['▧','Media Hub','media']].map(x=>'<button class="btn" style="justify-content:flex-start;min-height:54px" onclick="go(\''+x[2]+'\')">'+x[0]+' &nbsp;'+x[1]+'</button>').join('')+'</div><div class="notice" style="margin-top:15px">Todas as ações desta demonstração são locais ao teu navegador. Não criam registos, cobranças ou notificações reais.</div></div></div>';
}
function projectCard(p){return '<div class="project clickable-card" role="button" tabindex="0" onclick="showDetail(\'project\','+p.id+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();showDetail(\'project\','+p.id+')}"><div style="display:flex;gap:7px;justify-content:space-between"><span class="tag">'+e(p.type)+'</span><span class="hint">#'+p.id+'</span></div><h4 style="margin-top:13px">'+e(p.name)+' <span style="color:#9274d7">↗</span></h4><div class="project-meta">'+e(p.client)+' · '+e(p.owner)+'</div><div class="project-meta">Entrega: '+e(p.due)+' &nbsp;·&nbsp; '+eur(p.amount)+'</div><div class="progress"><div style="width:'+p.progress+'%"></div></div><div class="project-foot"><button class="btn sm" onclick="event.stopPropagation();moveProject('+p.id+',-1)" '+(p.stage===0?'disabled':'')+'>← Voltar</button><button class="btn primary sm" onclick="event.stopPropagation();moveProject('+p.id+',1)" '+(p.stage===2?'disabled':'')+'>'+(p.stage===1?'Finalizar':'Avançar →')+'</button></div></div>'}
function pipeline(stage){const a=allProjects();return title(stages[stage]+' de projetos','Fluxo de produção · move os cartões para testar', '<button class="btn primary" onclick="modal(\'project\')">+ Novo projeto</button>')+
 '<div class="filterbar"><div class="filters">'+stages.map((x,i)=>'<button class="filter '+(stage===i?'active':'')+'" onclick="go(\''+['captacao','edicao','finalizados'][i]+'\')">'+e(x)+' ('+db.projects.filter(p=>p.stage===i).length+')</button>').join('')+'</div><input class="input" style="width:min(280px,100%)" placeholder="Pesquisar projetos..." value="'+e(search)+'" oninput="findProjects(this.value)"></div>'+
 '<div class="kanban">'+stages.map((x,i)=>'<div class="kanban-col"><div class="kanban-head"><span>'+['🟣','🔵','🟢'][i]+' '+x+'</span><span class="tag grey">'+a.filter(p=>p.stage===i).length+'</span></div>'+a.filter(p=>p.stage===i).map(projectCard).join('')+(a.filter(p=>p.stage===i).length===0?'<div class="empty">Sem projetos nesta fase</div>':'')+'</div>').join('')+'</div>'}
function findProjects(v){search=v;const cursor=document.activeElement?.selectionStart;render();const x=document.querySelector('.filterbar input');if(x){x.focus();try{x.setSelectionRange(cursor,cursor)}catch(e){}}}
function moveProject(id,delta){const p=db.projects.find(x=>x.id===id);if(!p)return;p.stage=Math.max(0,Math.min(2,p.stage+delta));p.progress=[20,70,100][p.stage];persist();render();notify('Projeto movido para '+stages[p.stage])}
function tasks(){return title('Tarefas','Coordena a equipa e simula a conclusão do trabalho','<button class="btn primary" onclick="modal(\'task\')">+ Nova tarefa</button>')+'<div class="grid">'+kpi('Tarefas abertas',db.tasks.filter(t=>!t.done).length,'Por concluir')+kpi('Concluídas',db.tasks.filter(t=>t.done).length,'Esta semana')+kpi('Equipa',db.team.length,'Profissionais fictícios')+kpi('Projetos ativos',db.projects.filter(p=>p.stage<2).length,'Em produção')+'</div><div class="card section-space"><div class="surface-head"><h3>Quadro de tarefas</h3></div>'+db.tasks.map(t=>'<div class="list-row"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask('+t.id+')"><div class="grow"><div class="name" style="'+(t.done?'text-decoration:line-through;color:#a5a5b5':'')+'">'+e(t.title)+'</div><div class="sub">Responsável: '+e(t.owner)+'</div></div>'+statusTag(t.done?'Concluído':'Pendente')+'</div>').join('')+'</div>'}
function toggleTask(id){const t=db.tasks.find(x=>x.id===id);if(t){t.done=!t.done;persist();render()}}
function crm(){return title('CRM / Clientes','Relações comerciais e oportunidades simuladas','<button class="btn primary" onclick="modal(\'client\')">+ Novo cliente</button>')+'<div class="grid three">'+kpi('Clientes',db.clients.length,'Registados na demo')+kpi('Leads',db.clients.filter(x=>x.status==='Lead').length,'Em negociação')+kpi('Valor comercial',eur(sum(db.projects,'amount')),'Propostas e projetos')+'</div><div class="card section-space"><div class="surface-head"><h3>Carteira de clientes</h3><span class="hint">Os e-mails terminam em .invalid</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Cliente</th><th>Setor</th><th>Contacto fictício</th><th>Estado</th></tr></thead><tbody>'+db.clients.map(c=>'<tr class="clickable-row" tabindex="0" role="button" onclick="showDetail(\'client\','+c.id+')" onkeydown="if(event.key===\'Enter\')showDetail(\'client\','+c.id+')"><td><strong>'+e(c.name)+' ↗</strong></td><td>'+e(c.sector)+'</td><td>'+e(c.email)+'</td><td>'+statusTag(c.status)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function contracts(){return title('Contratos','Simula os estados de assinatura, sem documentos legais reais','<button class="btn primary" onclick="modal(\'contract\')">+ Novo contrato</button>')+'<div class="grid three">'+kpi('Contratos',db.contracts.length,'Na demonstração')+kpi('Assinados',db.contracts.filter(x=>x.status==='Assinado').length,'Sem validade legal')+kpi('Por assinar',db.contracts.filter(x=>x.status!=='Assinado').length,'Aguardam simulação')+'</div><div class="card section-space">'+db.contracts.map(c=>'<div class="list-row clickable-card" role="button" tabindex="0" onclick="showDetail(\'contract\','+c.id+')" onkeydown="if(event.key===\'Enter\')showDetail(\'contract\','+c.id+')"><span class="face">▣</span><div class="grow"><div class="name">'+e(c.name)+' ↗</div><div class="sub">'+e(c.client)+' · '+eur(c.value)+'</div></div>'+statusTag(c.status)+'<button class="btn sm" onclick="event.stopPropagation();signContract('+c.id+')">'+(c.status==='Assinado'?'Reabrir':'Simular assinatura')+'</button></div>').join('')+'</div>'}
function signContract(id){const c=db.contracts.find(x=>x.id===id);c.status=c.status==='Assinado'?'Por assinar':'Assinado';persist();render();notify('Estado do contrato simulado')}
function calendar(){const dt=new Date(2026,10+monthOffset,1);const year=dt.getFullYear(),m=dt.getMonth();const first=(new Date(year,m,1).getDay()+6)%7;const days=new Date(year,m+1,0).getDate();const iso=d=>year+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const dates=Array.from({length:first},()=>'<div></div>').concat(Array.from({length:days},(_,i)=>{let date=iso(i+1),has=db.events.some(x=>x.date===date);return '<button class="day '+(selectedDate===date?'active':'')+'" onclick="chooseDate(\''+date+'\')">'+(i+1)+(has?'<span class="events"></span>':'')+'</button>'}));return title('Calendário','Planeamento de filmagens, reuniões e entregas fictícias','<button class="btn primary" onclick="modal(\'event\')">+ Novo evento</button>')+'<div class="split"><div class="card"><div class="surface-head"><h3>'+e(dt.toLocaleDateString('pt-PT',{month:'long',year:'numeric'}))+'</h3><div class="toolbar"><button class="btn sm" onclick="monthChange(-1)">‹</button><button class="btn sm" onclick="monthChange(1)">›</button></div></div><div class="calendar">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>'<div class="weekday">'+x+'</div>').join('')+dates.join('')+'</div></div><div class="card"><div class="surface-head"><h3>Agenda · '+e(selectedDate)+'</h3></div>'+(db.events.filter(x=>x.date===selectedDate).map(ev=>'<div class="list-row"><span class="face">▦</span><div class="grow"><div class="name">'+e(ev.title)+'</div><div class="sub">'+e(ev.time)+'</div></div></div>').join('')||'<div class="empty">Sem eventos neste dia.</div>')+'<div class="notice" style="margin-top:15px">Podes adicionar eventos fictícios. Não existe integração ao Google Calendar nesta demo.</div></div></div>'}
function monthChange(x){monthOffset+=x;render()}function chooseDate(d){selectedDate=d;render()}
function chat(){const peers=Object.keys(db.messages);return title('Chat interno','Conversa de equipa, simulada e guardada apenas neste navegador','<span class="tag blue">Modo local</span>')+'<div class="chat"><div class="chat-users">'+peers.map(n=>'<button class="chat-person '+(selectedChat===n?'active':'')+'" onclick="switchChat(\''+escJs(n)+'\')"><span class="face">'+e(n.slice(0,2).toUpperCase())+'</span><span class="truncate">'+e(n)+'</span></button>').join('')+'</div><div class="chat-pane"><div class="surface-head" style="padding:14px 17px;border-bottom:1px solid #eee;margin:0"><h3>Conversa com '+e(selectedChat)+'</h3><span class="tag green">Fictícia</span></div><div class="chat-history">'+(db.messages[selectedChat]||[]).map(m=>'<div class="bubble '+(m.who==='me'?'me':'')+'">'+e(m.text)+'</div>').join('')+'</div><form class="chat-send" onsubmit="sendMessage(event)"><input class="input" id="chat-message" placeholder="Escreve uma mensagem fictícia..." required maxlength="250"><button class="btn primary" type="submit">Enviar</button></form></div></div>'}
function switchChat(s){selectedChat=s;render()}function sendMessage(ev){ev.preventDefault();let t=document.getElementById('chat-message').value.trim();if(!t)return;db.messages[selectedChat].push({who:'me',text:t});persist();render()}
function media(){return title('Media Hub','Biblioteca demonstrativa de conteúdos, sem ficheiros reais','<span class="tag blue">4 ficheiros fictícios</span>')+'<div class="grid">'+db.assets.map((a,i)=>'<div class="card clickable-card" role="button" tabindex="0" onclick="showDetail(\'asset\','+i+')" onkeydown="if(event.key===\'Enter\')showDetail(\'asset\','+i+')" style="padding:12px"><div class="media-cover c'+(i%4+1)+'"><span class="play">'+(a.type==='Vídeo'?'▶':'▧')+'</span><span class="duration">'+e(a.duration)+'</span></div><div class="media-title">'+e(a.name)+'</div><div class="sub hint" style="margin:8px 0">'+e(a.type)+' · Exemplo</div><button class="btn sm" onclick="event.stopPropagation();showDetail(\'asset\','+i+')">Ver detalhes</button></div>').join('')+'</div><div class="notice section-space">O Media Hub demonstrativo não faz upload nem elimina objetos R2. As capas são ilustrativas.</div>'}
function review(){const sel=db.reviews.find(x=>x.id===selectedReview)||db.reviews[0];return title('Revisão de vídeos','Aprovação de versões e comentários por timecode · simulado','<span class="tag">Sem acesso Cloudflare</span>')+'<div class="tabs">'+db.reviews.map(x=>'<button class="tab '+(sel.id===x.id?'active':'')+'" onclick="selectReview('+x.id+')">'+e(x.project)+'</button>').join('')+'</div><div class="split"><div class="card"><div class="area">▷ &nbsp; '+e(sel.project)+'</div><div class="surface-head" style="margin-top:15px"><h3>'+e(sel.project)+' · '+e(sel.version)+'</h3>'+statusTag(sel.state)+'</div><div class="toolbar"><button class="btn green" onclick="approveReview('+sel.id+')">✓ '+(sel.state==='Aprovado'?'Retirar aprovação':'Aprovar versão')+'</button><button class="btn" onclick="notify(\'Reprodução indisponível: vídeo fictício\')">▶ Simular reprodução</button></div><div class="notice" style="margin-top:16px">Visualização fictícia: os botões testam estados e comentários, não enviam notificações nem contactam o Stream.</div></div><div class="card"><div class="surface-head"><h3>Comentários no vídeo</h3><span class="tag grey">'+sel.comments.length+'</span></div>'+sel.comments.map(c=>'<div class="list-row" style="align-items:flex-start"><span class="face">'+e(c.who.slice(0,1))+'</span><div class="grow"><div class="name">'+e(c.who)+' <span class="tag">'+e(c.time)+'</span></div><div class="sub" style="line-height:1.5;color:#55566e;margin-top:8px">'+e(c.text)+'</div></div></div>').join('')+'<form onsubmit="addReviewComment(event)" style="margin-top:18px"><div class="grid two" style="gap:9px"><input class="input" type="text" id="review-time" value="00:25" placeholder="00:25" required maxlength="7"><input class="input" id="review-comment" placeholder="Adicionar comentário..." required maxlength="250"></div><button class="btn primary" style="margin-top:9px" type="submit">+ Comentar</button></form></div></div>'}
function selectReview(id){selectedReview=id;render()}function approveReview(id){const r=db.reviews.find(x=>x.id===id);r.state=r.state==='Aprovado'?'Em revisão':'Aprovado';persist();render();notify('Estado da revisão atualizado apenas nesta demo')}
function addReviewComment(ev){ev.preventDefault();const r=db.reviews.find(x=>x.id===selectedReview),t=document.getElementById('review-time').value,txt=document.getElementById('review-comment').value.trim();if(!/^\d{1,2}:\d{2}$/.test(t)){notify('Formato de tempo: 00:25');return}r.comments.push({who:'Tu (Demo)',time:t,text:txt});persist();render()}
function payments(){return title('Pagamentos','Recebimentos previstos e estados de cobrança fictícios','<span class="tag">Não liga ao Stripe</span>')+'<div class="grid three">'+kpi('Por receber',eur(sum(db.payments.filter(x=>x.status!=='Pago'))),'Pagamentos previstos')+kpi('Recebido',eur(sum(db.payments.filter(x=>x.status==='Pago'))),'Simulado')+kpi('Documentos',db.payments.length,'Lançamentos de teste')+'</div><div class="card section-space"><div class="surface-head"><h3>Plano de pagamentos</h3><span class="hint">Exemplo: pagamento no mês seguinte ao serviço</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Projeto</th><th>Cliente</th><th>Valor</th><th>Vencimento</th><th>Estado</th><th>Simular</th></tr></thead><tbody>'+db.payments.map(p=>'<tr class="clickable-row" tabindex="0" role="button" onclick="showDetail(\'payment\','+p.id+')" onkeydown="if(event.key===\'Enter\')showDetail(\'payment\','+p.id+')"><td><strong>'+e(p.project)+' ↗</strong></td><td>'+e(p.client)+'</td><td>'+eur(p.value)+'</td><td>'+e(p.due)+'</td><td>'+statusTag(p.status)+'</td><td><button class="btn sm" onclick="event.stopPropagation();markPayment('+p.id+')">'+(p.status==='Pago'?'Reabrir':'Marcar pago')+'</button></td></tr>').join('')+'</tbody></table></div></div>'}
function markPayment(id){const p=db.payments.find(x=>x.id===id);p.status=p.status==='Pago'?'Pendente':'Pago';persist();render();notify('Pagamento alterado apenas na demo')}
function finance(){const revenue=sum(db.projects,'amount'),paid=sum(db.payments.filter(x=>x.status==='Pago')),cost=Math.round(revenue*.42),profit=revenue-cost;return title('Financeiro 2.0','Receitas por competência, cobrança no mês seguinte e margem de projetos','<button class="btn" onclick="go(\'pagamentos\')">Ver pagamentos →</button>')+'<div class="grid">'+kpi('Projetos contratados',eur(revenue),'Valor total fictício')+kpi('Recebido',eur(paid),'Fluxo de caixa simulado')+kpi('Custos estimados',eur(cost),'42% da carteira, apenas exemplo')+kpi('Margem prevista',eur(profit),'Receita menos custo estimado')+'</div><div class="split section-space"><div class="card"><div class="surface-head"><h3>Rentabilidade por projeto</h3></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Projeto</th><th>Valor</th><th>Custo simulado</th><th>Margem</th></tr></thead><tbody>'+db.projects.map(p=>'<tr><td>'+e(p.name)+'</td><td>'+eur(p.amount)+'</td><td>'+eur(p.amount*.42)+'</td><td><strong>'+eur(p.amount*.58)+'</strong></td></tr>').join('')+'</tbody></table></div></div><div class="card"><div class="surface-head"><h3>Previsão de recebimentos</h3></div><div class="chart">'+[1450,2800,4900,6800,4200,7400].map((v,i)=>'<div class="bar-wrap"><div class="bar" style="height:'+Math.round(v/8000*100)+'%"></div><span class="bar-label">'+['Nov','Dez','Jan','Fev','Mar','Abr'][i]+'</span></div>').join('')+'</div><div class="notice" style="margin-top:12px">Valores meramente ilustrativos. A demo mostra a separação entre data do serviço, valor contratado e recebimento.</div></div></div>'}
function reports(){const completed=db.projects.filter(x=>x.stage===2).length;return title('Relatórios','Indicadores de produção e negócio fictícios','<button class="btn" onclick="notify(\'Os dados desta demo são locais e ilustrativos\')">ℹ Sobre os números</button>')+'<div class="grid">'+kpi('Projetos entregues',completed,'Processos finalizados')+kpi('Taxa de entrega',Math.round(completed/db.projects.length*100)+'%','Da carteira de teste')+kpi('Receita prevista',eur(sum(db.projects,'amount')),'Sem IVA, exemplo')+kpi('Versões aprovadas',db.reviews.filter(x=>x.state==='Aprovado').length,'Aprovações simuladas')+'</div><div class="grid two section-space"><div class="card"><h3 class="small-head">Distribuição por fase</h3>'+stages.map((name,i)=>{const pct=db.projects.filter(p=>p.stage===i).length/db.projects.length*100;return '<div class="list-row" style="display:block"><div style="display:flex;justify-content:space-between"><b>'+name+'</b><span>'+Math.round(pct)+'%</span></div><div class="progress"><div style="width:'+pct+'%"></div></div></div>'}).join('')+'</div><div class="card"><h3 class="small-head">Visão operacional</h3><div class="notice" style="margin-top:15px">Usa este painel para explorar como os indicadores poderão ser apresentados no WillFlow 2.0. A versão real dependerá da validação das regras de negócio e dos dados de produção.</div><button class="btn" style="margin-top:15px" onclick="go(\'financeiro\')">Abrir análise financeira →</button></div></div>'}
function invoices(){return title('Faturação','Documentos de teste, sem emissão fiscal','<button class="btn primary" onclick="modal(\'invoice\')">+ Fatura fictícia</button>')+'<div class="grid three">'+kpi('Faturas',db.invoices.length,'Fictícias')+kpi('Por emitir',db.invoices.filter(x=>x.status==='Por emitir').length,'Em preparação')+kpi('Total',eur(sum(db.invoices)),'Sem validade fiscal')+'</div><div class="card section-space"><div class="table-wrap"><table class="data-table"><thead><tr><th>Número</th><th>Cliente</th><th>Montante</th><th>Data</th><th>Estado</th><th>Ação</th></tr></thead><tbody>'+db.invoices.map(x=>'<tr class="clickable-row" tabindex="0" role="button" onclick="showDetail(\'invoice\','+x.id+')" onkeydown="if(event.key===\'Enter\')showDetail(\'invoice\','+x.id+')"><td><strong>'+e(x.number)+' ↗</strong></td><td>'+e(x.client)+'</td><td>'+eur(x.value)+'</td><td>'+e(x.date)+'</td><td>'+statusTag(x.status)+'</td><td><button class="btn sm" onclick="event.stopPropagation();issueInvoice('+x.id+')">Avançar estado</button></td></tr>').join('')+'</tbody></table></div></div>'}
function issueInvoice(id){const r=db.invoices.find(x=>x.id===id);r.status=r.status==='Por emitir'?'Emitida':r.status==='Emitida'?'Paga':'Por emitir';persist();render();notify('Fatura fictícia atualizada')}
function team(){return title('Equipa','Permissões, colaboradores e distribuição do trabalho fictícios','<span class="tag blue">RBAC ilustrativo</span>')+'<div class="grid">'+db.team.map(t=>'<div class="card clickable-card" role="button" tabindex="0" onclick="showDetail(\'team\','+db.team.indexOf(t)+')" onkeydown="if(event.key===\'Enter\')showDetail(\'team\','+db.team.indexOf(t)+')"><div style="display:flex;align-items:center;gap:10px"><span class="face">'+e(t.initial)+'</span><div><b>'+e(t.name)+'</b><div class="hint" style="margin-top:5px">'+e(t.role)+'</div></div></div><div class="progress" style="margin-top:22px"><div style="width:'+Math.min(100,t.work*24)+'%"></div></div><div class="hint">'+t.work+' responsabilidades atribuídas (exemplo)</div></div>').join('')+'</div><div class="notice section-space">Nesta demonstração os perfis são ilustrações de funções. Não são criados utilizadores, convites ou acessos reais.</div>'}
function plans(){const a=[['Starter','Equipa pequena','2 utilizadores · 20 projetos','Gestão essencial'],['Pro','Equipas em crescimento','10 utilizadores · projetos ilimitados','CRM + Relatórios + Equipa'],['Studio','Produção completa','Utilizadores ilimitados · 10 workspaces','API + Revisão + Automações']];return title('Planos','Comparação ilustrativa das funcionalidades do WillFlow','<span class="tag blue">Sem checkout</span>')+'<div class="grid three">'+a.map((p,i)=>'<div class="card clickable-card" role="button" tabindex="0" onclick="showDetail(\'plan\','+i+')" onkeydown="if(event.key===\'Enter\')showDetail(\'plan\','+i+')" style="'+(i===2?'border:2px solid #9574e7':'')+'"><span class="tag '+(i===2?'green':'')+'">'+(i===2?'Mais completo':'Plano')+'</span><h2 style="font-size:25px;letter-spacing:-1px;margin:18px 0 3px">'+p[0]+'</h2><p class="muted">'+p[1]+'</p><div class="list-row">'+p[2]+'</div><div class="list-row">'+p[3]+'</div><button class="btn '+(i===2?'primary':'')+'" style="width:100%;justify-content:center;margin-top:12px" onclick="event.stopPropagation();notify(\'Não há cobrança nesta demonstração\')">Experimentar (simulado)</button></div>').join('')+'</div>'}
function admin(){return title('Super Admin','Painel global ilustrativo, sem acesso a contas reais','<span class="tag orange">Exemplo de administração</span>')+'<div class="grid">'+kpi('Workspaces',44,'Todos fictícios')+kpi('Utilizadores',128,'Contas de demonstração')+kpi('Planos Studio',12,'Exemplo')+kpi('Alertas',3,'Apenas visuais')+'</div><div class="card section-space"><div class="surface-head"><h3>Monitorização da plataforma</h3></div>'+[['Utilização de armazenamento','Normal','green'],['Processamento de vídeo','Em validação','orange'],['Integração Stripe','Simulação','blue'],['Políticas de segurança','Em revisão','orange']].map(x=>'<div class="list-row"><span class="dot '+(x[2]==='green'?'green':x[2]==='orange'?'orange':'blue')+'"></span><div class="grow"><b>'+x[0]+'</b></div><span class="tag '+x[2]+'">'+x[1]+'</span></div>').join('')+'</div><div class="notice section-space">Este painel serve apenas para visualização. Não expõe métricas, clientes ou privilégios reais de Super Admin.</div>'}
function settings(){const used=6.8,limit=10;return title('Configurações','Preferências do workspace fictício','<button class="btn" onclick="resetDemo()">↺ Repor dados de demonstração</button>')+'<div class="split"><div class="card"><div class="surface-head"><h3>Workspace</h3></div><div class="field"><label>Nome do estúdio (local)</label><input id="workspace-name" class="input" maxlength="60" value="'+e(db.settings.workspace)+'"></div><div class="field"><label class="checkline"><input id="notifications" type="checkbox" '+(db.settings.notifications?'checked':'')+'> Simular notificações na interface</label></div><button class="btn primary" onclick="saveSettings()">Guardar preferências</button></div><div class="card"><div class="surface-head"><h3>Storage Manager · demonstração</h3></div><div class="kpi">6,8 GB <span class="hint">/ 10 GB</span></div><div class="storage-bar"><div class="used" style="width:68%"></div><div class="free" style="width:32%"></div></div><div class="hint" style="margin:12px 0">Quota total inclui extras. Não é o consumo real do WillFlow.</div><button class="btn" onclick="notify(\'Valores da demo atualizados visualmente; nenhuma escrita em BD\')">↻ Atualizar visualização</button></div></div><div class="notice section-space"><b>Isolamento de dados:</b> esta página não solicita acesso ao Supabase/Lovable, Stripe, Cloudflare nem Google. As alterações são guardadas apenas no armazenamento local deste navegador.</div>'}
function saveSettings(){db.settings.workspace=document.getElementById('workspace-name').value.trim()||'Estúdio Aurora';db.settings.notifications=document.getElementById('notifications').checked;persist();render();notify('Preferências guardadas localmente')}
function resetDemo(){if(!confirm('Repor todos os dados fictícios desta demonstração?'))return;db=copy(seed);persist();render();notify('Demonstração reiniciada')}
function modal(kind){
 const labels={project:'Novo projeto',client:'Novo cliente',task:'Nova tarefa',event:'Novo evento',contract:'Novo contrato',invoice:'Nova fatura fictícia'};
 const base={project:[['name','Nome do projeto','text'],['client','Cliente','text'],['amount','Valor (€)','number'],['due','Data de entrega','date']],client:[['name','Nome do cliente','text'],['sector','Área de atividade','text']],task:[['name','Descrição da tarefa','text'],['owner','Responsável','text']],event:[['name','Nome do evento','text'],['date','Data','date'],['time','Hora','time']],contract:[['name','Título do contrato','text'],['client','Cliente','text'],['amount','Valor (€)','number']],invoice:[['client','Cliente','text'],['amount','Valor (€)','number'],['date','Data','date']]};
 document.getElementById('modal-root').innerHTML='<div class="modal-wrap" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="surface-head"><div><h3>'+labels[kind]+'</h3><p class="hint">Registo de teste · não será enviado a ninguém.</p></div><button class="btn sm" onclick="closeModal()">✕</button></div><form onsubmit="submitModal(event,\''+kind+'\')">'+base[kind].map(f=>'<div class="field"><label>'+f[1]+'</label><input required class="input" id="m-'+f[0]+'" type="'+f[2]+'" '+(f[2]==='number'?'min="0" step="0.01"':'')+' '+(f[0]==='date'&&kind==='event'?'value="'+selectedDate+'"':'')+' maxlength="140"></div>').join('')+'<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" class="btn primary">Criar na demo</button></div></form></div></div>';
}
function showDetail(kind,id){
 const collections={project:db.projects,client:db.clients,asset:db.assets,payment:db.payments,invoice:db.invoices,contract:db.contracts,team:db.team,task:db.tasks,plan:[{name:'Starter',descricao:'Equipa pequena',limite:'2 utilizadores · 20 projetos',funcionalidades:'Gestão essencial'},{name:'Pro',descricao:'Equipas em crescimento',limite:'10 utilizadores · projetos ilimitados',funcionalidades:'CRM + Relatórios + Equipa'},{name:'Studio',descricao:'Produção completa',limite:'Utilizadores ilimitados · 10 workspaces',funcionalidades:'API + Revisão + Automações'}]};
 const arr=collections[kind]||[];
 const item=['asset','team','plan'].includes(kind)?arr[Number(id)]:arr.find(x=>x.id===Number(id));
 if(!item){notify('Não foi possível abrir este detalhe.');return}
 const headings={project:'Detalhes do projeto',client:'Ficha do cliente',asset:'Detalhes do conteúdo',payment:'Detalhes do pagamento',invoice:'Detalhes da fatura',contract:'Detalhes do contrato',team:'Ficha da equipa',task:'Detalhes da tarefa',plan:'Detalhes do plano'};
 const primary=kind==='project'?item.name:kind==='client'?item.name:kind==='asset'?item.name:kind==='payment'?item.project:kind==='invoice'?item.number:(item.name||item.title);
 const rows=Object.entries(item).filter(([k])=>k!=='id').map(([k,v])=>{
 const labels={name:'Nome',client:'Cliente',project:'Projeto',stage:'Estado',type:'Tipo',amount:'Valor',value:'Valor',due:'Entrega / Vencimento',date:'Data',progress:'Progresso',owner:'Responsável',sector:'Setor',email:'Contacto fictício',status:'Estado',number:'Número',duration:'Duração',version:'Versão'};
 const show=k==='stage'?stages[v]:k==='amount'||k==='value'?eur(v):k==='progress'?v+'%':String(v);
 return '<div class="list-row"><span class="hint" style="width:112px;flex-shrink:0">'+e(labels[k]||k)+'</span><strong class="grow" style="overflow-wrap:anywhere">'+e(show)+'</strong></div>';
 }).join('');
 document.getElementById('modal-root').innerHTML='<div class="modal-wrap" onclick="closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="'+e(headings[kind])+'" onclick="event.stopPropagation()"><div class="surface-head"><div><span class="tag blue">'+e(headings[kind])+'</span><h3 style="margin-top:12px">'+e(primary)+'</h3></div><button class="btn sm" onclick="closeModal()">✕</button></div>'+rows+'<div class="notice" style="margin-top:16px">Este detalhe contém apenas dados fictícios e não comunica com a aplicação real.</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Fechar</button></div></section></div>';
}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function submitModal(ev,kind){
 ev.preventDefault();const get=n=>(document.getElementById('m-'+n)?.value||'').trim();
 const next=a=>Math.max(0,...a.map(x=>Number(x.id)||0))+1;
 if(kind==='project')db.projects.push({id:next(db.projects),name:get('name'),client:get('client'),stage:0,type:'Novo projeto',amount:Number(get('amount')),due:get('due'),progress:0,owner:'Equipa Demo'});
 if(kind==='client')db.clients.push({id:next(db.clients),name:get('name'),sector:get('sector'),email:'sem-email@exemplo.invalid',status:'Lead'});
 if(kind==='task')db.tasks.push({id:next(db.tasks),title:get('name'),owner:get('owner'),done:false});
 if(kind==='event')db.events.push({id:next(db.events),title:get('name'),date:get('date'),time:get('time')});
 if(kind==='contract')db.contracts.push({id:next(db.contracts),name:get('name'),client:get('client'),status:'Por assinar',value:Number(get('amount'))});
 if(kind==='invoice')db.invoices.push({id:next(db.invoices),number:'FAT-DEMO-'+String(next(db.invoices)+20).padStart(3,'0'),client:get('client'),value:Number(get('amount')),date:get('date'),status:'Por emitir'});
 persist();closeModal();render();notify('Registo criado com sucesso, apenas na demonstração')
}
render();
</script></body></html>
