name: WillFlow video upload candidate tests

on:
  pull_request:
    paths:
      - 'docs/security/fase-a/video-integration/**'
      - '.github/workflows/willflow-video-candidate.yml'

permissions:
  contents: read

concurrency:
  group: willflow-video-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run isolated video upload integration tests
        run: bun x vitest run --config docs/security/fase-a/video-integration/vitest.config.ts
      - name: Verify candidate SHA256 hashes
        run: cd docs/security/fase-a/video-integration && sha256sum --check SHA256SUMS
